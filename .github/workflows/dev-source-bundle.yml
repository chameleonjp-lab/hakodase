name: P3-03R apply implementation payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p3-03r-apply-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm all payload parts exist
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          exists=true
          for part in 00 01 02 03; do
            if [[ ! -f ".github/p3-03r-payload.part${part}" ]]; then
              exists=false
            fi
          done
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Assemble, decode, and verify payload
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/p3-03r-payload.part00 \
            .github/p3-03r-payload.part01 \
            .github/p3-03r-payload.part02 \
            .github/p3-03r-payload.part03 \
            > /tmp/p3-03r-payload.b64
          echo 'f8673fffd0eb9cabd50b2c85becf2858359aca3bc3df6bcf732dd3453b812e07  /tmp/p3-03r-payload.b64' | sha256sum --check -
          base64 --decode /tmp/p3-03r-payload.b64 > /tmp/p3-03r-payload.tgz
          echo '1667287117d9760b6b24275328cc85b02d3ea2995c2393c6c30c1552b8529cf3  /tmp/p3-03r-payload.tgz' | sha256sum --check -

      - name: Apply files and remove temporary transport
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/p3-03r-payload.tgz -C .
          rm -f .github/p3-03r-payload.b64
          rm -f .github/p3-03r-payload.part00
          rm -f .github/p3-03r-payload.part01
          rm -f .github/p3-03r-payload.part02
          rm -f .github/p3-03r-payload.part03
          rm -f .github/workflows/dev-source-bundle.yml

      - name: Commit and push implementation
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hakodase-p3-03r-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement P3-03R generator v3'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
