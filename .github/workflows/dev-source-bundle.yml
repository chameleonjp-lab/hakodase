name: P3-03R apply implementation payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p3-03r-apply-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm payload exists
        id: payload
        shell: bash
        run: |
          if [[ -f .github/p3-03r-payload.b64 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and verify payload
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/p3-03r-payload.b64 > /tmp/p3-03r-payload.tgz
          echo '1667287117d9760b6b24275328cc85b02d3ea2995c2393c6c30c1552b8529cf3  /tmp/p3-03r-payload.tgz' | sha256sum --check -

      - name: Apply files and remove temporary transport
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/p3-03r-payload.tgz -C .
          rm -f .github/p3-03r-payload.b64
          rm -f .github/workflows/dev-source-bundle.yml

      - name: Commit and push implementation
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hakodase-p3-03r-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement P3-03R generator v3'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
