name: P3-03R export implementation payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: p3-03r-export-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify payload files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/p3-03r-payload.b64
          for part in 00 01 02 03; do
            test -f ".github/p3-03r-payload.part${part}"
          done
          wc -c .github/p3-03r-payload.b64 .github/p3-03r-payload.part*
          sha256sum .github/p3-03r-payload.b64 .github/p3-03r-payload.part*

      - name: Upload payload source files
        uses: actions/upload-artifact@v4
        with:
          name: hakodase-p3-03r-payload-source
          path: |
            .github/p3-03r-payload.b64
            .github/p3-03r-payload.part00
            .github/p3-03r-payload.part01
            .github/p3-03r-payload.part02
            .github/p3-03r-payload.part03
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
