name: P3-03R source bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bundle repository source for P3-03R development
        shell: bash
        run: |
          tar -czf hakodase-source.tgz \
            package.json package-lock.json .gitignore \
            src scripts test docs .github playwright.config.js index.html styles
      - uses: actions/upload-artifact@v4
        with:
          name: hakodase-p3-03r-source
          path: hakodase-source.tgz
          retention-days: 1
