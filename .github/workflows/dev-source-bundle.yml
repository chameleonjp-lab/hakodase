name: P3-03R recover implementation payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: p3-03r-recover-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Assemble and decode payload
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03; do
            test -f ".github/p3-03r-payload.part${part}"
          done

          cat \
            .github/p3-03r-payload.part00 \
            .github/p3-03r-payload.part01 \
            .github/p3-03r-payload.part02 \
            .github/p3-03r-payload.part03 \
            | tr -d '\r\n\t ' \
            > /tmp/p3-03r-payload.b64

          base64 --decode /tmp/p3-03r-payload.b64 > p3-03r-implementation.tgz
          tar -tzf p3-03r-implementation.tgz
          sha256sum /tmp/p3-03r-payload.b64 p3-03r-implementation.tgz

      - name: Upload recovered implementation
        uses: actions/upload-artifact@v4
        with:
          name: hakodase-p3-03r-implementation
          path: p3-03r-implementation.tgz
          if-no-files-found: error
          retention-days: 1
