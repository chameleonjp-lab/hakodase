name: Hakodase P3-05 Review Pack

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/p3-05-review-pack.js'
      - 'src/core/p3-05-playtest-record.js'
      - 'src/core/generator-v2.js'
      - 'src/core/generator-v3-catalog.js'
      - 'src/core/generator-v3-proof.js'
      - 'src/core/quality-metrics-v2.js'
      - 'scripts/p3-05-build-review-pack.mjs'
      - 'test/p3-05-review-pack.test.js'
      - 'test/p3-05-playtest-record.test.js'
      - 'src/data/p3-05-review-pack.json'
      - 'docs/review/P3_05_PLAYTEST_RECORDS.json'
      - 'docs/review/P3_05_PLAYTEST_SHEET.csv'
      - 'docs/review/P3_05_REVIEW_PACK_SUMMARY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p3-05-review-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hakodase-p3-05-review-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-review-pack:
    name: Build 66-candidate review pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build review evidence
        shell: bash
        run: |
          set -o pipefail
          npm run build:p3-05-review-pack -- \
            --out-dir review-output/p3-05 \
            --require-count 66 \
            2>&1 | tee review-output.log

      - name: Prepare committed review fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/data docs/review
          cp review-output/p3-05/review-pack.json src/data/p3-05-review-pack.json
          cp review-output/p3-05/playtest-records.json docs/review/P3_05_PLAYTEST_RECORDS.json
          cp review-output/p3-05/playtest-sheet.csv docs/review/P3_05_PLAYTEST_SHEET.csv
          cp review-output/p3-05/summary.md docs/review/P3_05_REVIEW_PACK_SUMMARY.md

      - name: Verify deterministic committed files
        shell: bash
        run: |
          set -euo pipefail
          cmp review-output/p3-05/review-pack.json src/data/p3-05-review-pack.json
          cmp review-output/p3-05/playtest-records.json docs/review/P3_05_PLAYTEST_RECORDS.json
          cmp review-output/p3-05/playtest-sheet.csv docs/review/P3_05_PLAYTEST_SHEET.csv
          cmp review-output/p3-05/summary.md docs/review/P3_05_REVIEW_PACK_SUMMARY.md

      - name: Commit generated review fixtures
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/data/p3-05-review-pack.json \
            docs/review/P3_05_PLAYTEST_RECORDS.json \
            docs/review/P3_05_PLAYTEST_SHEET.csv \
            docs/review/P3_05_REVIEW_PACK_SUMMARY.md; then
            echo 'Committed P3-05 review fixtures already match.'
            exit 0
          fi

          git config user.name 'hakodase-p3-05-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/data/p3-05-review-pack.json \
            docs/review/P3_05_PLAYTEST_RECORDS.json \
            docs/review/P3_05_PLAYTEST_SHEET.csv \
            docs/review/P3_05_REVIEW_PACK_SUMMARY.md
          git diff --cached --check
          git commit -m 'data: add P3-05 review fixtures'
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Add review summary
        if: always()
        shell: bash
        run: |
          if [[ -f review-output/p3-05/summary.md ]]; then
            cat review-output/p3-05/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload P3-05 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakodase-p3-05-review-pack-${{ github.run_attempt }}
          path: |
            review-output.log
            review-output/p3-05/review-pack.json
            review-output/p3-05/playtest-records.json
            review-output/p3-05/playtest-sheet.csv
            review-output/p3-05/summary.md
          if-no-files-found: error
          retention-days: 30
