name: Hakodase P3-04 Candidate Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/quality-metrics-v2.js'
      - 'src/core/candidate-audit-v2.js'
      - 'src/core/generator-v2.js'
      - 'src/core/exact-solver-v2.js'
      - 'src/core/board-data-v2.js'
      - 'src/core/board-hash.js'
      - 'src/core/rules.js'
      - 'src/core/rng.js'
      - 'scripts/p3-04-candidate-audit.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p3-04-candidate-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hakodase-p3-04-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-audit:
    name: 1001 candidate quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a full audit is required
        id: audit_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_audit=true

          if [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "synchronize" && -n "$BEFORE_SHA" && -n "$HEAD_SHA" ]]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > p3-04-changed-files.txt
            if grep -Eq '^(src/core/(quality-metrics-v2|candidate-audit-v2|generator-v2|exact-solver-v2|board-data-v2|board-hash|rules|rng)\.js|scripts/p3-04-candidate-audit\.mjs|package(-lock)?\.json)$' p3-04-changed-files.txt; then
              run_audit=true
            else
              run_audit=false
            fi
          fi

          echo "run_audit=$run_audit" >> "$GITHUB_OUTPUT"
          echo "P3-04 full audit required: $run_audit"
          if [[ -f p3-04-changed-files.txt ]]; then
            cat p3-04-changed-files.txt
          fi

      - name: Explain skipped audit
        if: steps.audit_changes.outputs.run_audit != 'true'
        shell: bash
        run: |
          {
            echo '# P3-04 full audit skipped'
            echo
            echo 'The latest synchronize event changed only documentation, reports, tests, or workflow metadata.'
            echo 'The previously successful 1001-candidate artifact remains the evidence for the unchanged audit runtime sources.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: steps.audit_changes.outputs.run_audit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.audit_changes.outputs.run_audit == 'true'
        run: npm ci

      - name: Run 1001 candidate audit
        if: steps.audit_changes.outputs.run_audit == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run audit:p3-04 -- \
            --count 1001 \
            --seed-prefix p3-04-audit-v1 \
            --out-dir audit-output/p3-04 \
            2>&1 | tee audit-output.log

      - name: Add summary to workflow
        if: always() && steps.audit_changes.outputs.run_audit == 'true'
        shell: bash
        run: |
          if [[ -f audit-output/p3-04/summary.md ]]; then
            cat audit-output/p3-04/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate audit evidence
        if: always() && steps.audit_changes.outputs.run_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hakodase-p3-04-audit-${{ github.run_attempt }}
          path: |
            audit-output.log
            audit-output/p3-04/audit.json
            audit-output/p3-04/candidates.csv
            audit-output/p3-04/summary.md
          if-no-files-found: error
          retention-days: 30
