name: Apply one-time 10-block celebration fix

on:
  push:
    branches:
      - agent/hakodase-runtime-10-blocks-v2

permissions:
  contents: write

concurrency:
  group: hakodase-runtime-ten-main-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/hakodase-runtime-10-blocks-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Patch celebration palette indexing and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/main.js')
          text = source.read_text(encoding='utf-8')
          old = 'const color = PALETTE[i % Math.max(2, board.blocks.length)];'
          new = 'const color = PALETTE[i % PALETTE.length];'
          if text.count(old) != 1:
              raise SystemExit(f'expected one celebration palette expression, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/patch-runtime-ten-main.yml').unlink()
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hakodase-runtime-ten-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.js .github/workflows/patch-runtime-ten-main.yml
          git diff --cached --check
          git commit -m 'fix: keep clear particles within palette bounds'
          git push origin HEAD:agent/hakodase-runtime-10-blocks-v2
