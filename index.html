<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <title>HAKODASE / ハコダセ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234cc2ff'/%3E%3Crect x='8' y='8' width='16' height='16' rx='4' fill='%2304222f'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="title">HAKODASE<span class="subtitle">ハコダセ｜倉庫の色分け出荷</span></h1>
      <button id="homeShare" class="btn btn-link" type="button">ゲームをシェア</button>
      <a class="platform-link" href="https://chameleonjp-lab.github.io/chameleonjp_lab/" target="_blank" rel="noopener noreferrer">カメレオンJPの実験場へ</a>
    </header>

    <section class="name-card" aria-labelledby="playerNameLabel">
      <label id="playerNameLabel" for="playerName">ランキング表示名</label>
      <input id="playerName" type="text" maxlength="20" autocomplete="nickname" placeholder="名前を入力してください" />
      <p id="nameMessage" class="name-message" role="status" aria-live="polite"></p>
    </section>

    <section class="stats">
      <div class="stat"><span class="stat-label">タイム</span><span id="time" class="stat-value">0.00秒</span></div>
      <div class="stat"><span class="stat-label">手数</span><span id="moves" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">目標</span><span id="target" class="stat-value">-</span></div>
    </section>

    <section class="board-wrap">
      <canvas id="board"></canvas>
    </section>

    <p id="message" class="message" data-kind="info"></p>

    <section class="controls">
      <label class="ctrl">
        <span>難易度</span>
        <select id="difficulty"></select>
      </label>
      <button id="retry" class="btn">やりなおし</button>
      <button id="new" class="btn btn-primary">新しい盤面</button>
    </section>

    <form id="seedForm" class="seed-row">
      <input id="seedInput" class="seed-input" type="text" inputmode="text" placeholder="seed を指定（任意）" />
      <button class="btn" type="submit">この seed で出題</button>
      <span id="seed" class="seed-current"></span>
    </form>

    <section class="ranking-section">
      <div class="ranking-head">
        <h2>この端末の記録（この難易度）</h2>
        <button id="clearRanking" class="btn btn-ghost">記録を消去</button>
      </div>
      <ol id="ranking" class="ranking"></ol>
    </section>

    <section id="resultPanel" class="result-panel" hidden aria-labelledby="resultTitle">
      <div class="result-card">
        <h2 id="resultTitle">クリア結果</h2>
        <p id="resultSummary" class="result-summary"></p>
        <textarea id="resultShareText" class="result-share-text" readonly aria-label="結果のシェア文"></textarea>
        <div class="result-actions">
          <button id="resultShare" class="btn btn-primary" type="button">結果をシェア（文面をコピー）</button>
          <button id="resultRetry" class="btn" type="button">もう一度</button>
          <button id="resultNew" class="btn" type="button">新しい盤面</button>
        </div>
        <p id="resultShareStatus" class="result-status" role="status" aria-live="polite"></p>
        <section class="online-ranking" aria-labelledby="onlineRankingTitle">
          <h3 id="onlineRankingTitle">スコアランキング TOP10</h3>
          <ol id="onlineRankingList"><li>ランキングを読み込み中…</li></ol>
          <p id="onlineRankingStatus" class="result-status" role="status" aria-live="polite"></p>
        </section>
        <a class="platform-link" href="https://chameleonjp-lab.github.io/chameleonjp_lab/" target="_blank" rel="noopener noreferrer">カメレオンJPの実験場へ</a>
      </div>
    </section>

    <footer class="howto">
      <p>箱をドラッグすると壁・他の箱・盤端に当たるまで一気に滑ります。各箱を同じ色（記号）の搬出口から盤外へ出すとクリア。出す順番がカギです。</p>
      <p id="homeShareStatus" class="home-share-status" role="status" aria-live="polite"></p>
    </footer>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
